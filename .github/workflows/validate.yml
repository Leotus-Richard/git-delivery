name: Validate package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate package and local resource closure
        run: python scripts/validate_package.py
      - name: Test package boundaries and reproducible release archives
        run: python -m unittest discover -s tests -p test_package_tools.py -v
      - name: Run bundled helper tests when present
        run: python scripts/test_helpers.py
      - name: Build all release formats
        run: python scripts/build_release.py
